name = "galius-web"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# Después de crear el namespace con `wrangler kv namespace create LEADS_KV`,
# reemplazá el id de abajo por el que te devuelva ese comando (ver README.md).
[[kv_namespaces]]
binding = "LEADS_KV"
id = "REEMPLAZAR_CON_TU_ID_DE_KV"
